# Tiny Tapeout project information
project:
  title:        "INNOVA IRV ULP RISC-V SoC"      # Project title
  author:       "Kris / KLuterIRV"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Compact RV32E-like ultra-low-power SoC with SRAM boot memory, GPIO, UART, I2C, WFI and IRQ support"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     20000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "4x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_kluterirv_rv32e_core"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
  - "top/tt_um_kluterirv_rv32e_core.v"
  - "core/irv_core.v"
  - "core/irv_regfile.v"
  - "core/irv_alu.v"
  - "core/irv_decoder.v"
  - "core/irv_fetch.v"
  - "core/irv_pc_ctrl.v"
  - "soc/irv_peripheral_bus.v"
  - "mem/sram128x16.v"
  - "peripherals/gpio0.v"
  - "peripherals/uart0.v"
  - "peripherals/i2c0.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "boot_we"
  ui[1]: "boot_addr[0]"
  ui[2]: "boot_addr[1] / uart_rx_debug_mode"
  ui[3]: "boot_addr[2]"
  ui[4]: "boot_addr[3]"
  ui[5]: "boot_addr[4]"
  ui[6]: "boot_addr[5]"
  ui[7]: "boot_addr[6]"

  # Outputs
  uo[0]: "gpio_out[0] / boot_debug[0] / uart_rx_debug[0]"
  uo[1]: "gpio_out[1] / boot_debug[1] / uart_rx_debug[1]"
  uo[2]: "gpio_out[2] / boot_debug[2] / uart_rx_debug[2]"
  uo[3]: "gpio_out[3] / boot_debug[3] / uart_rx_debug[3]"
  uo[4]: "gpio_out[4] / boot_debug[4] / uart_rx_debug[4]"
  uo[5]: "gpio_out[5] / boot_debug[5] / uart_rx_debug[5]"
  uo[6]: "gpio_out[6] / boot_debug[6] / uart_rx_debug[6]"
  uo[7]: "gpio_out[7] / boot_debug[7] / uart_rx_debug[7]"

  # Bidirectional pins
  uio[0]: "uart_tx / boot_data[0] / boot_addr[7]"
  uio[1]: "uart_rx / boot_data[1]"
  uio[2]: "i2c_scl / boot_data[2]"
  uio[3]: "i2c_sda / boot_data[3]"
  uio[4]: "boot_data[4]"
  uio[5]: "boot_data[5]"
  uio[6]: "boot_data[6]"
  uio[7]: "boot_data[7]"

# Do not change!
yaml_version: 6
